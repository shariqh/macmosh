name: Icon pictures
# Look step 5a (issue 175): builds the debug app with its icon on macOS 15 and 26, checks the icon files in it, and
# draws the icon as the system gives it, in light and then in dark, plus the icon document's six styles drawn by
# Apple's ictool (scripts/ci/icon-pictures.sh says what it checks).
# The Remove confirmation's pictures, where an alert may show the icon, come from the Menu pictures workflow.
on:
  pull_request:
    paths: ['App/**', 'scripts/build-app.sh', 'scripts/make-icon.sh', 'scripts/draw-icon/**', 'scripts/ci/icontool.swift',
            'scripts/ci/icon-pictures.sh', 'Sources/MacMoshKit/Look/IconArt.swift', '.github/workflows/icon-pictures.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: icon-pictures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  icon:
    name: icon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - name: About the runner
        timeout-minutes: 2
        run: |
          sw_vers
          xcodebuild -version | head -n 1
          ls -d /Applications/Xcode*.app
          command -v assetutil iconutil sips || true
          ls -d /Applications/Xcode*.app/Contents/Applications/Icon\ Composer.app/Contents/Executables/ictool || true
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true
      - name: Build the debug app and icontool
        id: build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/build-app.sh --debug
          swiftc -O -o dist/debug/icontool scripts/ci/icontool.swift
          codesign --force --sign - dist/debug/icontool
      - name: The icon in light
        timeout-minutes: 4
        env:
          ICON_OUT: ${{ runner.temp }}/icon-pictures/light
        run: scripts/ci/icon-pictures.sh light
      # The switch is read back: a run that stayed light is a setup failure, not a set of light pictures.
      # Dark runs when a light check failed too, so one failure does not hide the dark pictures.
      - name: Turn on dark
        id: dark
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          style=$(defaults read -g AppleInterfaceStyle 2>/dev/null || true)
          echo "AppleInterfaceStyle reads: ${style:-nothing}"
          [ "$style" = Dark ] || { echo "::error::The runner did not switch to dark; no dark pictures were taken."; exit 1; }
      - name: The icon in dark
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.dark.outcome == 'success' }}
        timeout-minutes: 4
        env:
          ICON_OUT: ${{ runner.temp }}/icon-pictures/dark
        run: scripts/ci/icon-pictures.sh dark
      - name: Upload the pictures and logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-pictures-${{ matrix.os }}
          path: ${{ runner.temp }}/icon-pictures
          retention-days: 14
