name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and shellcheck
        run: brew install tmux shellcheck
      - name: Build, test and lint
        run: scripts/check.sh
      - name: Build the app and check that it starts
        run: |
          set -euo pipefail
          scripts/build-app.sh --adhoc

          # The command inside the bundle prints the version the Info.plist carries.
          expected=$(plutil -extract CFBundleShortVersionString raw dist/MacMosh.app/Contents/Info.plist)
          actual=$(dist/MacMosh.app/Contents/Helpers/macmosh --version)
          if [ "$actual" != "$expected" ]; then
            echo "the command printed '$actual', expected '$expected'" >&2
            exit 1
          fi

          # Start the app on an empty support folder (no workhorses, so no ssh call) and see it stay up.
          support=$(mktemp -d)
          MACMOSH_SUPPORT_DIR="$support" dist/MacMosh.app/Contents/MacOS/MacMosh &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" || ! pgrep -x MacMosh; then
            echo "MacMosh is not running 5 seconds after it started" >&2
            wait "$app_pid" || echo "it exited with status $?" >&2
            exit 1
          fi

          # The app says in the system log what its menu did (MenuLog). With no workhorses saved, the
          # first check must end in the "No workhorses yet" menu. Without that line the menu would
          # still say "Checking…" and offer nothing to click.
          want='menu refreshed: symbol=plus.circle workhorses=0 lines=2'
          seen=0
          for _ in 1 2 3 4 5 6; do
            /usr/bin/log show --last 5m --style compact \
              --predicate 'subsystem == "io.github.shariqh.macmosh"' > "$support/app-log.txt" 2>&1 || true
            if grep -qF "$want" "$support/app-log.txt"; then
              seen=1
              break
            fi
            sleep 5
          done
          if [ "$seen" -ne 1 ]; then
            echo "the app never logged: $want" >&2
            echo "what it did log:" >&2
            cat "$support/app-log.txt" >&2
            exit 1
          fi

          # The MacMosh window never opens at launch, only from the menu's Open MacMosh line (issue #125).
          if grep -qF 'window opened' "$support/app-log.txt"; then
            echo "the app logged 'window opened' at launch:" >&2
            cat "$support/app-log.txt" >&2
            exit 1
          fi

          # Nobody has opened the menu yet, so the log must not say that anyone did.
          if grep -qF 'menu opened' "$support/app-log.txt"; then
            echo "the app logged 'menu opened' before anyone opened the menu:" >&2
            cat "$support/app-log.txt" >&2
            exit 1
          fi

          # Open the menu the way a person does, by clicking its icon, and see the app say so.
          # The click can take until the menu closes to come back, so it runs in the background.
          osascript scripts/ci-open-menu.applescript > "$support/click.txt" 2>&1 &
          click_pid=$!
          opened=0
          for _ in 1 2 3 4 5 6; do
            sleep 5
            /usr/bin/log show --last 5m --style compact \
              --predicate 'subsystem == "io.github.shariqh.macmosh"' > "$support/app-log.txt" 2>&1 || true
            if grep -qF 'menu opened' "$support/app-log.txt"; then
              opened=1
              break
            fi
          done
          # Escape closes the menu again.
          osascript -e 'tell application "System Events" to key code 53' || true
          kill "$click_pid" 2>/dev/null || true
          wait "$click_pid" 2>/dev/null || true
          kill "$app_pid"
          wait "$app_pid" || true
          if [ "$opened" -ne 1 ]; then
            echo "the app never logged 'menu opened' after its icon was clicked" >&2
            echo "what the click said:" >&2
            cat "$support/click.txt" >&2
            echo "what the app logged:" >&2
            cat "$support/app-log.txt" >&2
            exit 1
          fi
          cat "$support/click.txt"
          grep -F 'MacMosh' "$support/app-log.txt" | tail -n 6
