name: Menu pictures

# Starts a debug build of the app with each sample menu (issue #113), opens its menu and submenus
# with posted pointer events, and uploads a picture of each step with the app's log. It fails only
# when the app does not start, the menu does not open, a click runs the wrong row or none, an open
# submenu closes under the pointer, or a held change is shown before the clicked row ran (and, in the
# "changing" sample, when the hold could not be tested); never on how a picture looks.
# scripts/ci/drive-menu.sh says what it checks.
on:
  pull_request:
    paths:
      - 'Sources/MacMoshApp/**'
      - 'Sources/MacMoshKit/Menu/**'
      - 'Sources/MacMoshKit/Board/**'
      - 'Sources/MacMoshKit/Tabs/**'
      - 'scripts/ci/**'
      - 'scripts/build-app.sh'
      - '.github/workflows/menu-pictures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-pictures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pictures:
    name: pictures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: About the runner
        timeout-minutes: 2
        run: |
          sw_vers
          xcodebuild -version | head -n 1
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true

      - name: Build the debug app and the driver
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/build-app.sh --debug
          swiftc -O -o dist/debug/menutool scripts/ci/menutool.swift
          codesign --force --sign - dist/debug/menutool

      - name: Drive the menu
        timeout-minutes: 12
        env:
          MENU_OUT: ${{ runner.temp }}/menu-pictures
        run: scripts/ci/drive-menu.sh

      - name: Upload the pictures and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menu-pictures-${{ matrix.os }}
          path: ${{ runner.temp }}/menu-pictures
          retention-days: 14
