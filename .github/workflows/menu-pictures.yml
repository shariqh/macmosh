name: Menu pictures

# Starts a debug build of the app with each sample menu (issue #113), opens its menu and submenus
# with posted pointer events, and uploads a picture of each step with the app's log. Then it opens the
# MacMosh window from the menu on seven samples (issue #125), clicks in it and closes it
# (scripts/ci/drive-window.sh, which fails when the window shows at launch or does not open, a click
# runs the wrong button, closing the window ends the app, or, in the "windows" sample (issue #134), a
# desk's details do not list its windows or a desk whose tab can be found opens a tab, or, in the
# "window-forms" sample (issue #143), a form does not open, refuse a taken name, send its exact arguments to
# the stand-in ssh or say what happened, or (issue #147) a name that starts with a dash is not refused, or
# Command-V, A, C, X, Z, Shift-Command-Z or Command-W does not do its job in the window or sets off the menu-open
# signal, or, in the "window-ended" sample (issue #152), an ended desk is not listed under Ended, Start again
# does not send its exact arguments, or Forget sends anything). It fails only
# when the app does not start, the menu does not open, a click runs the wrong row or none, an open
# submenu closes under the pointer, or a held change is shown before the clicked row ran (and, in the
# "changing" sample, when the hold could not be tested), and in the "windows" sample when a window
# line is missing, its click does not reach its action in the app's log, or the workhorse's summary
# is not one fact per line; never on how a picture looks.
# For naming a window (issue 144), the window's run also fails when a Name button or the sheet does not
# work or does not send its exact arguments. In the "window-settings" sample (issue 157) it fails when the
# Settings page does not save exactly the clicked or edited field into the sample's own saved list, a bad
# value is saved or not refused with its sentence, a new name does not show at once, a button does not
# send its exact tab command, or a click or key press on the page sets off the menu-open signal. For a new desk's
# first window (issue 163) it fails when the New desk form's "Same name as the desk" line does not work or Make desk
# does not send exactly the window's name, and, in the "window-forms-0.11" sample, when an older script is shown the
# line or sent the name.
# scripts/ci/drive-menu.sh says what it checks.
on:
  pull_request:
    paths:
      - 'Sources/MacMoshApp/**'
      - 'Sources/MacMoshKit/**'
      - 'scripts/ci/**'
      - 'scripts/build-app.sh'
      - '.github/workflows/menu-pictures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-pictures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pictures:
    name: pictures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: About the runner
        timeout-minutes: 2
        run: |
          sw_vers
          xcodebuild -version | head -n 1
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true

      - name: Build the debug app and the driver
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/build-app.sh --debug
          swiftc -O -o dist/debug/menutool scripts/ci/menutool.swift
          codesign --force --sign - dist/debug/menutool
          swiftc -O -o dist/debug/windowtool scripts/ci/windowtool.swift
          codesign --force --sign - dist/debug/windowtool

      - name: Drive the menu
        id: menu
        timeout-minutes: 12
        env:
          MENU_OUT: ${{ runner.temp }}/menu-pictures
        run: scripts/ci/drive-menu.sh

      # The MacMosh window (issue #125): opened from the menu's Open MacMosh line, clicked in, closed.
      # It runs when the menu's step failed too, so one failure does not hide the other's pictures.
      - name: Drive the window
        if: ${{ !cancelled() && (steps.menu.outcome == 'success' || steps.menu.outcome == 'failure') }}
        timeout-minutes: 24
        env:
          MENU_OUT: ${{ runner.temp }}/menu-pictures/window
        run: scripts/ci/drive-window.sh

      - name: Upload the pictures and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: menu-pictures-${{ matrix.os }}
          path: ${{ runner.temp }}/menu-pictures
          retention-days: 14
